<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <style>
      .title { font: bold 22px/1.2 sans-serif; fill:#0b1220 }
      .sub { font: 14px sans-serif; fill:#102032 }
      .node { fill:#0ea5a4; stroke:#063b3b; stroke-width:1 }
      .link { stroke:#0b1220; stroke-width:2; opacity:0.7 }
      .bg { fill:#f8fafc }
    </style>
  </defs>

  <rect width="1200" height="420" class="bg" rx="8"/>
  <text x="36" y="40" class="title">AI Illustration</text>
  <text x="36" y="64" class="sub">Abstract neural graph representing embeddings, reasoning, and orchestration</text>

  <!-- nodes -->
  <circle cx="220" cy="180" r="18" class="node" />
  <circle cx="320" cy="120" r="14" class="node" />
  <circle cx="420" cy="180" r="20" class="node" />
  <circle cx="520" cy="140" r="16" class="node" />
  <circle cx="640" cy="200" r="22" class="node" />
  <circle cx="780" cy="160" r="18" class="node" />
  <circle cx="920" cy="200" r="24" class="node" />

  <!-- links -->
  <line x1="220" y1="180" x2="320" y2="120" class="link" />
  <line x1="320" y1="120" x2="420" y2="180" class="link" />
  <line x1="420" y1="180" x2="520" y2="140" class="link" />
  <line x1="520" y1="140" x2="640" y2="200" class="link" />
  <line x1="640" y1="200" x2="780" y2="160" class="link" />
  <line x1="780" y1="160" x2="920" y2="200" class="link" />

  <!-- center brain -->
  <g transform="translate(640,100)">
    <ellipse cx="0" cy="0" rx="120" ry="60" fill="#fff" stroke="#0b1220" stroke-width="2" />
    <text x="-80" y="6" class="sub">Reasoning</text>
  </g>

  <text x="36" y="380" class="sub">File: docs/images/ai-illustration.svg</text>
</svg>
